name: Deploy Docs

on:
  push:
    branches: ["master"]
    paths:
      - 'docs/**'
      - '.github/workflows/deploy_docs.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Eleventy
        run: npm run build --workspace=docs

      - name: Setup Pages
        # The official site is published by upstream; forks still build the docs.
        if: github.repository == 'Hypfer/Valetudo'
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: 'docs/dist'

  deploy:
    if: github.repository == 'Hypfer/Valetudo'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
